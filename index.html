<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilamentForge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">

    <header class="bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between">
        <h1 class="font-bold text-orange-400">FilamentForge AI</h1>
        <button onclick="app.generateRandomRelief()" class="bg-orange-600 px-3 py-1.5 rounded-lg text-xs font-bold">Случайный узор</button>
    </header>

    <main class="flex-1 flex flex-col relative">
        <div id="canvas-container" class="w-full flex-1 min-h-[400px]"></div>
        
        <div class="bg-gray-900 p-4 border-t border-gray-800 space-y-3">
            <label class="block text-xs text-gray-300">Загрузить картинку из галереи:</label>
            <input type="file" accept="image/*" onchange="app.handleFile(event)" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-700 cursor-pointer">
        </div>
    </main>

    <script>
        class App {
            constructor() {
                this.init3D();
                this.generateRandomRelief(); // Сразу строим стартовую модель
            }

            init3D() {
                const container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x030712);

                this.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
                this.camera.position.set(0, -120, 100);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(this.renderer.domElement);

                this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
                const light = new THREE.DirectionalLight(0xffffff, 0.8);
                light.position.set(50, -100, 100);
                this.scene.add(light);

                // Вращение пальцем
                let isDragging = false, prevX = 0, prevY = 0;
                container.addEventListener('touchstart', e => { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; });
                window.addEventListener('touchend', () => isDragging = false);
                window.addEventListener('touchmove', e => {
                    if(!isDragging || !this.mesh) return;
                    this.mesh.rotation.z += (e.touches[0].clientX - prevX) * 0.005;
                    this.mesh.rotation.x += (e.touches[0].clientY - prevY) * 0.005;
                    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
                });

                const animate = () => {
                    requestAnimationFrame(animate);
                    this.renderer.render(this.scene, this.camera);
                };
                animate();
            }

            buildFromImage(img) {
                const canvas = document.createElement('canvas');
                const w = 48, h = 48;
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const imgData = ctx.getImageData(0, 0, w, h).data;

                if (this.mesh) this.scene.remove(this.mesh);

                const geom = new THREE.PlaneGeometry(80, 80, w - 1, h - 1);
                const pos = geom.attributes.position;

                for (let i = 0; i < pos.count; i++) {
                    const x = i % w, y = Math.floor(i / w);
                    const idx = (y * w + x) * 4;
                    const bright = (0.299 * imgData[idx] + 0.587 * imgData[idx+1] + 0.114 * imgData[idx+2]) / 255;
                    pos.setZ(i, bright * 3.5);
                }
                geom.computeVertexNormals();

                this.mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4, flatShading: true }));
                this.mesh.rotation.x = -Math.PI / 2;
                this.scene.add(this.mesh);
            }

            handleFile(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => this.buildFromImage(img);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            generateRandomRelief() {
                const canvas = document.createElement('canvas');
                canvas.width = 48; canvas.height = 48;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, 48, 48);
                grad.addColorStop(0, '#111'); grad.addColorStop(0.5, '#ea580c'); grad.addColorStop(1, '#f8fafc');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 48, 48);
                
                const img = new Image();
                img.onload = () => this.buildFromImage(img);
                img.src = canvas.toDataURL();
            }
        }
        const app = new App();
    </script>
</body>
</html>
