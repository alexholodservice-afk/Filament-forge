<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FilamentForge AI - Студия филаментной живописи</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js для 3D предпросмотра -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #030712; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 2px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Шапка -->
    <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-tr from-orange-500 via-amber-500 to-yellow-400 p-2 rounded-xl text-gray-950 font-black shadow-lg">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-none bg-gradient-to-r from-orange-400 to-amber-200 bg-clip-text text-transparent">FilamentForge AI</h1>
                <span class="text-[10px] text-gray-400">Android Веб-Студия</span>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="app.exportSTL()" class="bg-orange-600 active:bg-orange-700 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1 shadow">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>STL</span>
            </button>
        </div>
    </header>

    <!-- Основная рабочая зона -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- 3D Холст предпросмотра -->
        <div id="canvas-container" class="w-full flex-1 relative min-h-[300px] bg-gray-950">
            <!-- Приветственный оверлей -->
            <div id="welcomeOverlay" class="absolute inset-0 bg-gray-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="bg-gradient-to-b from-orange-500/10 to-transparent border border-orange-500/30 p-6 rounded-3xl max-w-sm space-y-4 shadow-2xl">
                    <div class="w-14 h-14 bg-orange-500/20 rounded-2xl flex items-center justify-center mx-auto text-orange-400">
                        <i data-lucide="upload-cloud" class="w-8 h-8"></i>
                    </div>
                    <h2 class="text-lg font-bold text-white">Загрузите фото с телефона</h2>
                    <p class="text-xs text-gray-300">Выберите картинку из галереи, и приложение мгновенно построит 3D-модель для печати.</p>
                    
                    <!-- Кнопка выбора файла для Android -->
                    <label class="w-full bg-gradient-to-r from-orange-600 to-amber-600 active:scale-95 text-white py-3 rounded-xl text-xs font-bold shadow-lg transition cursor-pointer flex items-center justify-center space-x-2">
                        <i data-lucide="image-plus" class="w-4 h-4"></i>
                        <span>Открыть галерею</span>
                        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="app.handleImageUpload(event)">
                    </label>

                    <button onclick="app.loadDemoImage()" class="w-full bg-gray-900 border border-gray-800 text-gray-300 py-2 rounded-xl text-xs font-semibold">
                        Запустить демо-пример
                    </button>
                </div>
            </div>
            
            <!-- Оверлей загрузки -->
            <div id="aiLoadingOverlay" class="absolute inset-0 bg-gray-950/80 backdrop-blur-sm hidden flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="animate-spin text-orange-500 mb-3"><i data-lucide="loader-2" class="w-10 h-10"></i></div>
                <div id="aiLoadingText" class="text-sm font-bold text-orange-300">Построение модели...</div>
            </div>

            <!-- Индикатор слоев -->
            <div class="absolute top-3 left-3 bg-gray-900/90 backdrop-blur border border-gray-800 px-3 py-1.5 rounded-xl text-[11px] text-gray-300 z-10 flex items-center space-x-2 shadow">
                <span>Слоев: <strong id="totalLayersCount" class="text-orange-400">0</strong></span>
            </div>
        </div>

        <!-- Нижняя панель управления -->
        <div class="bg-gray-900 border-t border-gray-800 p-4 space-y-3 rounded-t-3xl shadow-2xl z-30">
            <div class="flex items-center justify-between text-xs text-gray-300">
                <span>Макс. высота рельефа:</span>
                <span id="maxHeightVal" class="text-orange-400 font-bold">3.2 мм</span>
            </div>
            <input type="range" id="maxHeight" min="1.0" max="6.0" step="0.2" value="3.2" oninput="app.updateSettings()" class="w-full accent-orange-500">
            
            <label class="w-full bg-gray-800 active:bg-gray-700 text-gray-200 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center space-x-2 cursor-pointer">
                <i data-lucide="refresh-cw" class="w-4 h-4 text-orange-400"></i>
                <span>Загрузить другую картинку</span>
                <input type="file" accept="image/*" class="hidden" onchange="app.handleImageUpload(event)">
            </label>
        </div>
    </main>

    <!-- Скрипт -->
    <script>
        class FilamentForgeApp {
            constructor() {
                this.imageObj = null;
                this.maxHeight = 3.2;
                this.layerHeight = 0.08;
                this.initThree();
            }

            initThree() {
                const container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x030712);

                this.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
                this.camera.position.set(0, -140, 110);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);

                this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
                dirLight.position.set(50, -100, 100);
                this.scene.add(dirLight);

                let isDragging = false, prevX = 0, prevY = 0;
                container.addEventListener('touchstart', e => { if(e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; } });
                window.addEventListener('touchend', () => { isDragging = false; });
                window.addEventListener('touchmove', e => {
                    if(!isDragging || e.touches.length !== 1 || !this.mesh) return;
                    this.mesh.rotation.z += (e.touches[0].clientX - prevX) * 0.005;
                    this.mesh.rotation.x += (e.touches[0].clientY - prevY) * 0.005;
                    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
                });

                this.animate();
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.renderer.render(this.scene, this.camera);
            }

            showLoader(text, callback) {
                const loader = document.getElementById('aiLoadingOverlay');
                document.getElementById('aiLoadingText').innerText = text;
                loader.classList.remove('hidden');
                setTimeout(() => {
                    loader.classList.add('hidden');
                    if(callback) callback();
                }, 400);
            }

            handleImageUpload(e) {
                const
